version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nikave_postgres
    environment:
      POSTGRES_DB: nikave_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nikave_pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nikave_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  nikave_pgdata:

