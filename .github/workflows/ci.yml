name: NIKAVE CI & Deployment Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-build:
    name: Lint, Typecheck & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Typecheck & Build
        run: npm run build

  deploy-to-vercel:
    name: Automated Vercel Production Deployment
    needs: validate-and-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Vercel Production Deployment
        run: |
          echo "🚀 Triggering automated production deployment on Vercel..."
          RESPONSE=$(curl -s -w "\nHTTP_STATUS:%{http_code}" -X POST "https://api.vercel.com/v1/integrations/deploy/prj_mDZBN9AcST3sdd0XRFUf6vxkj4eu/xIgr92NSGA")
          echo "$RESPONSE"
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$HTTP_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 201 ]; then
            echo "✅ Vercel production deployment triggered successfully."
            echo "🌐 Live Production URL: https://nikave-transport-solutions.vercel.app"
          else
            echo "⚠️ Deployment webhook returned HTTP $HTTP_STATUS (Vercel native Git integration will also deploy on push)."
          fi
